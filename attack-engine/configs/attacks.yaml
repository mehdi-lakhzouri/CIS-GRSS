# Attack Engine - attack parameters (Phases 3-4).
#
# Proposed experimental parameters for all five families; no detector is consulted.

# Seed for per-window execution draws (sign, spike positions, replay source choice).
global_seed: 14

# Physical target bounds for SOIL_MOISTURE_5 (m3/m3); a project contract, not universal.
target_low: 0.0
target_high: 0.70

# Optional grid applied to candidate (modified) values only. null disables it.
quantum: 0.001

spike:
  magnitude: 0.30        # abrupt jump, comparable to a strong false hydric event
  sign: random
  min_points: 1
  max_points: 3

bias:
  magnitude: 0.05        # constant additive offset; must keep the window within bounds
  sign: random

drift:
  final_magnitude: 0.10  # deviation reached at the end of the ramp
  sign: random
  max_slope_per_hour: 0.02
  hold_first: true

replay:
  min_age_hours: 24      # the source must start at least this long before the window

stealth:
  magnitude_min: 0.005
  magnitude_max: 0.015
  sign: random
  residual_tolerance_multiplier: 1.0
  max_change_rate: 0.003       # injected-offset change, m3/m3 per elapsed hour
  max_step_change: 0.05        # emitted-measurement change, m3/m3 per elapsed hour
  max_cumulative_drift: 0.08   # total variation of the offset across one event
  min_attack_impact: 0.002     # mean abs error over ALL reserved positions
  required_context_features: [SOIL_MOISTURE_10, P_CALC, SOIL_TEMP_5, T_HR_AVG]
  min_history_hours: 24
  calibration_path: ../calibrations/uscrn_train.json # relative to this YAML
  missing_context_policy: reject_window
  max_candidate_attempts: 8
  attack_partitions: [validation, test] # train windows are explicitly rejected
  ridge_alpha: 1.0
  residual_quantile: 0.99
  residual_floor: 0.001
  min_training_rows: 240
